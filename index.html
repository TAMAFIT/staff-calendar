<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d8f4d">
    <meta name="robots" content="noindex, nofollow">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="たまカレンダー">
    <title>たまフィット スタッフカレンダー</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./assets/icon-192.png">
    <link rel="preconnect" href="https://script.google.com">
    <link rel="stylesheet" href="./styles/tokens.css">
    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/calendar.css">
    <link rel="stylesheet" href="./styles/forms.css">
    <link rel="stylesheet" href="./styles/history.css">
    <link rel="stylesheet" href="./styles/sync.css">
  </head>
  <body>
    <div id="app" aria-live="polite"></div>

    <dialog class="confirm-dialog pwa-install-dialog" id="pwaInstallDialog">
      <div class="confirm-dialog__body">
        <p class="eyebrow">iPhoneでアプリとして追加</p>
        <h2>Safariからホーム画面に追加</h2>
        <ol class="pwa-install-dialog__steps">
          <li>画面下の共有ボタンを押す</li>
          <li>「ホーム画面に追加」を選ぶ</li>
          <li>右上の「追加」を押す</li>
        </ol>
        <div class="confirm-dialog__actions is-single">
          <button class="button button--primary button--wide" type="button" data-pwa-dialog-close>わかりました</button>
        </div>
      </div>
    </dialog>

    <script type="module" src="./src/local-first-app.js"></script>
    <script type="module" src="./src/calendar-view-toggle.js"></script>
    <script type="module" src="./src/calendar-swipe.js"></script>
  </body>
</html>
