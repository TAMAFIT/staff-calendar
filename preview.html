<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d8f4d">
    <meta name="robots" content="noindex, nofollow">
    <title>ローカル確認｜たまフィット スタッフカレンダー</title>
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles/tokens.css">
    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/calendar.css">
    <link rel="stylesheet" href="./styles/forms.css">
  </head>
  <body>
    <div id="app" aria-live="polite"></div>

    <dialog class="confirm-dialog" id="confirmDialog">
      <div class="confirm-dialog__body">
        <p class="eyebrow" id="confirmEyebrow">内容確認</p>
        <h2 id="confirmTitle">この内容で保存しますか？</h2>
        <div class="confirm-dialog__summary" id="confirmSummary"></div>
        <div class="confirm-dialog__actions">
          <button class="button button--quiet" type="button" data-dialog-cancel>戻る</button>
          <button class="button button--primary" type="button" data-dialog-confirm>保存する</button>
        </div>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./preview-app.js"></script>
  </body>
</html>
