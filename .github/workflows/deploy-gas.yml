name: Deploy Staff Calendar GAS

on:
  push:
    branches: [main]
    paths:
      - "gas/**"
      - ".github/workflows/deploy-gas.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staff-calendar-gas-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Check browser worker syntax
        run: node --check service-worker.js

      - name: Check Apps Script syntax
        run: |
          cp gas/Code.gs /tmp/tamafit-staff-calendar-gas.js
          node --check /tmp/tamafit-staff-calendar-gas.js

      - name: Configure clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          test -n "$CLASP_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > .clasp.json

      - name: Push Apps Script source
        run: npx --yes @google/clasp@3.3.0 push --force

      - name: Redeploy production web app
        env:
          DEPLOYMENT_ID: AKfycbzQf3thjGYKpV13bH6V0n1ZKQT23Wvvx8K7CQhRNIuH6mAQwih9Cg28r3ETnz9AVB4Etw
        run: npx --yes @google/clasp@3.3.0 update-deployment "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}"
