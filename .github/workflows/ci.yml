name: Staff Calendar CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: production-bundle
          path: app.bundle.js
          if-no-files-found: error
          retention-days: 3

      - name: Build preview bundle
        run: npm run build:preview

      - name: Check service worker syntax
        run: node --check service-worker.js

      - name: Check Apps Script syntax
        run: |
          cp gas/Code.gs /tmp/tamafit-staff-calendar-gas.js
          node --check /tmp/tamafit-staff-calendar-gas.js
